<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学生报到</title>
  <script src="/static/js/auth.js"></script>
  <link rel="stylesheet" href="/static/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/checkin.css">
</head>
<body class="inner-body">
  <div class="page-container">
    <div class="notice" id="checkin-notice" hidden></div>

    <div class="checkin-stats">
      <div class="checkin-stat">
        <div class="label">应到人数</div>
        <div class="value" id="stat-total">0</div>
        <div class="hint">按当前筛选</div>
      </div>
      <div class="checkin-stat checked">
        <div class="label">已报到</div>
        <div class="value" id="stat-checked">0</div>
        <div class="hint">已完成报到</div>
      </div>
      <div class="checkin-stat unchecked">
        <div class="label">未报到</div>
        <div class="value" id="stat-unchecked">0</div>
        <div class="hint">待办理</div>
      </div>
      <div class="checkin-stat">
        <div class="label">报到率</div>
        <div class="value" id="stat-rate">0%</div>
        <div class="checkin-rate-bar"><span id="stat-rate-bar" style="width:0%"></span></div>
      </div>
    </div>

    <div class="card search-card">
      <div class="card-body">
        <form class="search-form" id="search-form">
          <div class="search-item">
            <label for="class-select">班级</label>
            <select class="form-select form-select-sm" id="class-select">
              <option value="0">全部班级</option>
            </select>
          </div>
          <div class="search-item">
            <label for="status-select">报到状态</label>
            <select class="form-select form-select-sm" id="status-select">
              <option value="all">全部</option>
              <option value="checked">已报到</option>
              <option value="unchecked">未报到</option>
            </select>
          </div>
          <div class="search-item">
            <label for="keyword-input">学生姓名</label>
            <input class="form-control form-control-sm" id="keyword-input" placeholder="请输入姓名" autocomplete="off">
          </div>
          <div class="search-actions">
            <button class="btn btn-primary btn-sm" type="submit">查询</button>
            <button class="btn btn-default btn-sm" type="reset">重置</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card" id="table-card">
      <div class="card-body">
        <div class="toolbar">
          <button class="btn btn-primary btn-sm" id="btn-checkin-all" type="button" disabled>全部报到</button>
          <button class="btn btn-default btn-sm" id="btn-refresh" type="button">刷新</button>
          <span class="toolbar-note">共 <strong id="checkin-count">0</strong> 人</span>
        </div>

        <div class="table-responsive">
          <table class="table table-hover table-sm align-middle">
            <thead>
              <tr>
                <th style="width:60px;">ID</th>
                <th>学生</th>
                <th>性别</th>
                <th>年级</th>
                <th>班级</th>
                <th>任课老师</th>
                <th>状态</th>
                <th>报到时间</th>
                <th>备注</th>
                <th style="width:80px;">操作</th>
              </tr>
            </thead>
            <tbody id="checkin-tbody">
              <tr><td colspan="10" class="table-empty">正在加载…</td></tr>
            </tbody>
          </table>
        </div>

        <div id="checkin-pagination"></div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="checkin-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="checkin-form">
        <div class="modal-header">
          <h5 class="modal-title" id="checkin-modal-title">学生报到</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
        </div>
        <div class="modal-body">
          <div class="checkin-student-info" id="checkin-student-info"></div>
          <label class="form-label" for="checkin-remark">备注</label>
          <textarea class="form-control form-control-sm" id="checkin-remark" name="remark" rows="3" maxlength="200" placeholder="可选，例如：已交材料 / 迟到"></textarea>
        </div>
        <div class="modal-footer">
          <button class="btn btn-default btn-sm" type="button" data-bs-dismiss="modal">取消</button>
          <button class="btn btn-primary btn-sm" id="checkin-submit" type="submit">确认报到</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/checkin.js"></script>
</body>
</html>
