<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>教师管理</title>
  <script src="/static/js/auth.js"></script>
  <link rel="stylesheet" href="/static/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/common.css">
</head>
<body class="inner-body">
  <div class="page-container">
    <div class="notice">
      现有后端的教师新增 / 修改接口仍按旧字段 <code>subject</code> 写入，而数据库实际为
      <code>subject_id</code>，因此本页暂不提供新增与编辑。删除教师时会一并删除其排课记录；
      如果教师名下有学生，需要先选择接替教师，学生会自动转移。
    </div>

    <div class="card search-card">
      <div class="card-body">
        <form class="search-form" id="search-form">
          <div class="search-item">
            <label for="keyword-input">教师姓名</label>
            <input class="form-control form-control-sm" id="keyword-input" name="keyword" placeholder="请输入姓名关键字" autocomplete="off">
          </div>
          <div class="search-item">
            <label for="subject-filter">任教科目</label>
            <select class="form-select form-select-sm" id="subject-filter">
              <option value="">全部科目</option>
            </select>
          </div>
          <div class="search-actions">
            <button class="btn btn-primary btn-sm" type="submit">查询</button>
            <button class="btn btn-default btn-sm" type="reset">重置</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card" id="table-card">
      <div class="card-body">
        <div class="toolbar">
          <button class="btn btn-default btn-sm" id="btn-refresh" type="button">刷新</button>
          <span class="toolbar-note">共 <strong id="teacher-count">0</strong> 名教师</span>
        </div>

        <div class="table-responsive">
          <table class="table table-hover table-sm align-middle">
            <thead>
              <tr>
                <th style="width:60px;">ID</th>
                <th>姓名</th>
                <th>性别</th>
                <th>年龄</th>
                <th>任教科目</th>
                <th>联系电话</th>
                <th>班级</th>
                <th style="width:120px;">操作</th>
              </tr>
            </thead>
            <tbody id="teacher-tbody">
              <tr><td colspan="8" class="table-empty">正在加载…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="detail-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">教师详情</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
        </div>
        <div class="modal-body" id="detail-content">
          <div class="empty-state">加载中…</div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-default btn-sm" type="button" data-bs-dismiss="modal">关闭</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="delete-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">删除教师</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
        </div>
        <div class="modal-body">
          <div class="notice" id="delete-info"></div>
          <div id="replace-wrap" hidden>
            <label class="form-label" for="replace-teacher">接替教师</label>
            <select class="form-select form-select-sm" id="replace-teacher"></select>
            <p class="toolbar-note" style="margin-top:8px;">该教师名下的学生将转到所选教师名下。</p>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-default btn-sm" type="button" data-bs-dismiss="modal">取消</button>
          <button class="btn btn-danger btn-sm" id="confirm-delete" type="button">确认删除</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/teacher.js"></script>
</body>
</html>
