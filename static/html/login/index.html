<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - 教务管理系统</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23409eff'/%3E%3Ctext x='32' y='45' font-size='34' text-anchor='middle' fill='white' font-family='sans-serif'%3E%E6%95%99%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/login.css">
</head>
<body class="login-body">
  <div class="login-shell">
    <section class="login-brand">
      <div class="login-brand-inner">
        <div class="login-logo">教</div>
        <h1>教务管理系统</h1>
        <p class="lead">学生 · 教师 · 课程一体化校务管理平台</p>
        <ul class="login-features">
          <li>学生档案、班级归属与成绩查看</li>
          <li>教师信息与任教科目维护</li>
          <li>班级信息与上课地址维护</li>
          <li>课程设置与学分管理</li>
        </ul>
      </div>
      <div class="login-brand-footer">Educational Administration System</div>
    </section>

    <section class="login-panel">
      <div class="login-card">
        <div class="login-card-head">
          <h2>登录</h2>
          <p>请输入账号和密码进入管理后台</p>
        </div>

        <div class="login-alert" id="login-alert" role="alert" hidden></div>

        <form id="login-form" novalidate>
          <label class="login-field" for="username">
            <span>账号</span>
            <div class="login-input">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input id="username" name="username" type="text" placeholder="请输入账号" autocomplete="username" autofocus>
            </div>
          </label>

          <label class="login-field" for="password">
            <span>密码</span>
            <div class="login-input">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
              <input id="password" name="password" type="password" placeholder="请输入密码" autocomplete="current-password">
              <button class="password-toggle" id="password-toggle" type="button">显示</button>
            </div>
          </label>

          <div class="login-options">
            <label class="login-remember">
              <input id="remember" type="checkbox">
              记住登录
            </label>
            <span class="login-demo">演示账号：admin / 123456</span>
          </div>

          <button class="btn btn-primary login-submit" id="login-submit" type="submit">登 录</button>

          <div class="login-register">
            <span>还没有账号？</span>
            <button class="link-button" id="open-register" type="button">注册账号</button>
          </div>
        </form>

        <div class="login-card-foot">© 2026 教务管理系统</div>
      </div>
    </section>
  </div>

  <!-- 注册账号 -->
  <div class="modal fade" id="register-modal" tabindex="-1" aria-labelledby="register-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="register-form" novalidate>
        <div class="modal-header">
          <h5 class="modal-title" id="register-title">注册账号</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
        </div>
        <div class="modal-body">
          <div class="login-alert" id="register-alert" role="alert" hidden></div>

          <div class="mb-3">
            <label class="form-label" for="register-username">账号 <span class="text-danger">*</span></label>
            <input class="form-control" id="register-username" name="username" maxlength="20" placeholder="3-20 位字母、数字或下划线" autocomplete="username">
          </div>
          <div class="mb-3">
            <label class="form-label" for="register-name">显示名称</label>
            <input class="form-control" id="register-name" name="displayName" maxlength="20" placeholder="选填，默认使用账号" autocomplete="nickname">
          </div>
          <div class="mb-3">
            <label class="form-label" for="register-password">密码 <span class="text-danger">*</span></label>
            <input class="form-control" id="register-password" name="password" type="password" maxlength="50" placeholder="至少 6 位" autocomplete="new-password">
          </div>
          <div class="mb-0">
            <label class="form-label" for="register-confirm">确认密码 <span class="text-danger">*</span></label>
            <input class="form-control" id="register-confirm" name="confirm" type="password" maxlength="50" placeholder="再次输入密码" autocomplete="new-password">
          </div>

          <p class="register-tip">账号信息保存在本机浏览器（localStorage）中，仅用于演示，请勿使用真实密码。</p>
        </div>
        <div class="modal-footer">
          <button class="btn btn-default btn-sm" type="button" data-bs-dismiss="modal">取消</button>
          <button class="btn btn-primary btn-sm" id="register-submit" type="submit">注 册</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/static/js/login.js"></script>
</body>
</html>
