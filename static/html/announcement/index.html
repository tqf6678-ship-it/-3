<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>公告管理</title>
  <script src="/static/js/auth.js"></script>
  <link rel="stylesheet" href="/static/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/announcement.css">
</head>
<body class="inner-body">
  <div class="page-container">
    <div class="card search-card">
      <div class="card-body">
        <form class="search-form" id="search-form">
          <div class="search-item">
            <label for="keyword-input">标题 / 内容</label>
            <input class="form-control form-control-sm" id="keyword-input" placeholder="请输入关键字" autocomplete="off">
          </div>
          <div class="search-item">
            <label for="status-filter">状态</label>
            <select class="form-select form-select-sm" id="status-filter">
              <option value="-1">全部</option>
              <option value="1">已发布</option>
              <option value="0">草稿</option>
            </select>
          </div>
          <div class="search-actions">
            <button class="btn btn-primary btn-sm" type="submit">查询</button>
            <button class="btn btn-default btn-sm" type="reset">重置</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card" id="table-card">
      <div class="card-body">
        <div class="toolbar">
          <button class="btn btn-primary btn-sm" id="btn-add" type="button">＋ 新增公告</button>
          <button class="btn btn-default btn-sm" id="btn-refresh" type="button">刷新</button>
          <span class="toolbar-note">共 <strong id="announcement-count">0</strong> 条</span>
        </div>

        <div class="table-responsive">
          <table class="table table-hover table-sm align-middle">
            <thead>
              <tr>
                <th style="width:60px;">ID</th>
                <th>标题</th>
                <th style="width:90px;">状态</th>
                <th>发布时间</th>
                <th>更新时间</th>
                <th style="width:150px;">操作</th>
              </tr>
            </thead>
            <tbody id="announcement-tbody">
              <tr><td colspan="6" class="table-empty">正在加载…</td></tr>
            </tbody>
          </table>
        </div>

        <div id="announcement-pagination"></div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="announcement-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <form class="modal-content" id="announcement-form">
        <div class="modal-header">
          <h5 class="modal-title" id="announcement-modal-title">新增公告</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" for="announcement-title">标题 <span class="text-danger">*</span></label>
            <input class="form-control form-control-sm" id="announcement-title" name="title" maxlength="100" required autocomplete="off">
          </div>
          <div class="mb-3">
            <label class="form-label" for="announcement-content">内容 <span class="text-danger">*</span></label>
            <textarea class="form-control form-control-sm announcement-form-textarea" id="announcement-content" name="content" rows="8" maxlength="5000" required></textarea>
          </div>
          <div>
            <label class="form-label" for="announcement-status">状态</label>
            <select class="form-select form-select-sm" id="announcement-status" name="status">
              <option value="1">已发布</option>
              <option value="0">草稿</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-default btn-sm" type="button" data-bs-dismiss="modal">取消</button>
          <button class="btn btn-primary btn-sm" id="announcement-submit" type="submit">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal fade" id="view-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">公告详情</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
        </div>
        <div class="modal-body">
          <h4 class="announcement-view-title" id="view-title"></h4>
          <div class="announcement-meta" id="view-meta"></div>
          <div class="announcement-content" id="view-content"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-default btn-sm" type="button" data-bs-dismiss="modal">关闭</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/announcement.js"></script>
</body>
</html>
